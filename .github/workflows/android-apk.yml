name: Build Roozino Android Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Create release keystore
        shell: bash
        run: |
          echo "${{ secrets.ROOZINO_KEYSTORE_BASE64 }}" | base64 --decode > android/roozino-release-key.jks

      - name: Create key.properties
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ROOZINO_STORE_PASSWORD }}
          keyPassword=${{ secrets.ROOZINO_KEY_PASSWORD }}
          keyAlias=${{ secrets.ROOZINO_KEY_ALIAS }}
          storeFile=../roozino-release-key.jks
          EOF

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/roozino-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roozino-v1.0.0-release
          path: build/app/outputs/flutter-apk/roozino-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/app/outputs/flutter-apk/roozino-v1.0.0.apk \
            --title "روزینو ${GITHUB_REF_NAME}" \
            --notes "نسخه اول روزینو - APK امضاشده اندروید"